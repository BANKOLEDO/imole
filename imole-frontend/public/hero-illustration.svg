<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Imole — the light</title>
  <desc>An atmospheric night scene: a glowing orb of light pours a soft beam over layered savanna hills, acacia trees and birds.</desc>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#002d54"/>
      <stop offset="1" stop-color="#03162a"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE4C2" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#FFB84D" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#FF8A00" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGrad" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FFE4C2"/>
      <stop offset="0.75" stop-color="#FFB84D"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC66B" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#FFB84D" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FF8A00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="poolGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC66B" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FF8A00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fb3d9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7fb3d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a2b45"/><stop offset="1" stop-color="#062038"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#072540"/><stop offset="1" stop-color="#041f35"/></linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#051f33"/><stop offset="1" stop-color="#031a2c"/></linearGradient>
    <filter id="veil" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <g id="sparkle">
      <path d="M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2 Z" fill="#FFF4E6"/>
    </g>
    <g id="bird">
      <path d="M 0 8 C 5 0 12 0 16 7 C 20 0 27 0 32 8" fill="none" stroke="#FFF4E6" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    </g>
    <g id="acacia">
      <path d="M -3 0 L 3 0 L 2 -54 L -2 -54 Z"/>
      <path d="M -2 -54 C 4 -60 12 -58 16 -63" fill="none" stroke="#021022" stroke-width="2.5"/>
      <ellipse cx="-30" cy="-64" rx="13" ry="6"/>
      <ellipse cx="-16" cy="-68" rx="14" ry="6.5"/>
      <ellipse cx="0" cy="-70" rx="15" ry="7"/>
      <ellipse cx="14" cy="-68" rx="14" ry="6.5"/>
      <ellipse cx="28" cy="-64" rx="13" ry="6"/>
      <ellipse cx="-22" cy="-60" rx="12" ry="5.5"/>
      <ellipse cx="4" cy="-61" rx="12" ry="5.5"/>
      <ellipse cx="20" cy="-60" rx="12" ry="5.5"/>
    </g>
  </defs>

  <!-- night sky -->
  <rect width="800" height="800" fill="url(#skyGrad)"/>

  <!-- stars -->
  <g fill="#FFF4E6" opacity="0.35">
    <circle cx="110" cy="130" r="2"/><circle cx="200" cy="70" r="2.2"/><circle cx="640" cy="110" r="2"/>
    <circle cx="700" cy="60" r="1.6"/><circle cx="740" cy="230" r="1.8"/><circle cx="80" cy="300" r="1.6"/>
    <circle cx="160" cy="210" r="1.8"/><circle cx="680" cy="360" r="2"/><circle cx="600" cy="200" r="1.6"/>
  </g>
  <use href="#sparkle" x="240" y="330" opacity="0.45" transform="scale(0.8)"/>
  <use href="#sparkle" x="580" y="330" opacity="0.45" transform="scale(0.8)"/>
  <use href="#sparkle" x="120" y="480" opacity="0.35" transform="scale(0.7)"/>

  <!-- birds -->
  <use href="#bird" transform="translate(230 190) scale(0.9)"/>
  <use href="#bird" transform="translate(560 160) scale(0.7)"/>

  <!-- the light: wide wash -->
  <circle cx="400" cy="300" r="300" fill="url(#glowGrad)"/>

  <!-- volumetric beam -->
  <g filter="url(#veil)">
    <polygon points="400,320 230,715 570,715" fill="url(#beamGrad)"/>
    <polygon points="400,320 300,715 500,715" fill="url(#beamGrad)" opacity="0.75"/>
  </g>

  <!-- the glowing orb -->
  <circle cx="400" cy="300" r="95" fill="url(#orbGrad)"/>
  <circle cx="400" cy="300" r="26" fill="#FFFFFF" opacity="0.92"/>

  <!-- soft halo at the beam's origin -->
  <circle cx="400" cy="335" r="70" fill="url(#glowGrad)" opacity="0.7"/>

  <!-- floating light motes -->
  <g fill="#FFC66B" opacity="0.8">
    <circle cx="300" cy="210" r="4"/><circle cx="470" cy="180" r="3"/><circle cx="520" cy="260" r="4.5"/>
    <circle cx="280" cy="330" r="3.5"/>
  </g>
  <circle cx="400" cy="560" r="3" fill="#FFC66B" opacity="0.5"/>

  <!-- atmospheric haze -->
  <ellipse cx="400" cy="590" rx="480" ry="80" fill="url(#mistGrad)"/>
  <ellipse cx="400" cy="655" rx="420" ry="60" fill="url(#mistGrad)" opacity="0.7"/>

  <!-- savanna hills, layered with depth -->
  <path d="M 0 600 C 160 548 320 556 480 596 C 640 634 720 620 800 588 L 800 800 L 0 800 Z" fill="url(#hill1)"/>
  <path d="M 0 652 C 200 610 420 622 600 660 C 700 682 760 664 800 646 L 800 800 L 0 800 Z" fill="url(#hill2)"/>
  <path d="M 0 706 C 180 676 340 680 500 706 C 640 728 720 712 800 692 L 800 800 L 0 800 Z" fill="url(#hill3)"/>

  <!-- acacia silhouettes -->
  <use href="#acacia" transform="translate(430 606) scale(0.45)"/>
  <use href="#acacia" transform="translate(158 644) scale(0.85)"/>
  <use href="#acacia" transform="translate(648 702) scale(0.72)"/>

  <!-- pool of light where the beam lands -->
  <ellipse cx="400" cy="722" rx="340" ry="46" fill="url(#poolGrad)"/>
</svg>