<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="favTitle">
  <title id="favTitle">Imole favicon — glowing sunburst</title>
  <desc>A tiny glowing African sunburst: cream disc, radiating rays and a white-hot core.</desc>
  <defs>
    <radialGradient id="fav-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A00" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FF8A00" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fav-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFC66B"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </radialGradient>
    <g id="fav-ray">
      <line x1="16" y1="3.5" x2="16" y2="0.8" stroke="#FF8A00" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="fav-ray-s">
      <line x1="16" y1="3" x2="16" y2="1.5" stroke="#FFC66B" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#fav-halo)"/>
  <use href="#fav-ray"/><use href="#fav-ray" transform="rotate(45 16 16)"/>
  <use href="#fav-ray" transform="rotate(90 16 16)"/><use href="#fav-ray" transform="rotate(135 16 16)"/>
  <use href="#fav-ray" transform="rotate(180 16 16)"/><use href="#fav-ray" transform="rotate(225 16 16)"/>
  <use href="#fav-ray" transform="rotate(270 16 16)"/><use href="#fav-ray" transform="rotate(315 16 16)"/>
  <use href="#fav-ray-s" transform="rotate(22.5 16 16)"/><use href="#fav-ray-s" transform="rotate(67.5 16 16)"/>
  <use href="#fav-ray-s" transform="rotate(112.5 16 16)"/><use href="#fav-ray-s" transform="rotate(157.5 16 16)"/>
  <use href="#fav-ray-s" transform="rotate(202.5 16 16)"/><use href="#fav-ray-s" transform="rotate(247.5 16 16)"/>
  <use href="#fav-ray-s" transform="rotate(292.5 16 16)"/><use href="#fav-ray-s" transform="rotate(337.5 16 16)"/>
  <circle cx="16" cy="16" r="11" fill="#FFF4E6" stroke="#002444" stroke-width="2"/>
  <circle cx="16" cy="16" r="4.5" fill="url(#fav-core)"/>
  <circle cx="16" cy="16" r="1.8" fill="#FFFFFF"/>
</svg>